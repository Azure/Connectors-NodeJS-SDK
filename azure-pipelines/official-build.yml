parameters:
  - name: IsPrerelease
    type: boolean
    default: true

trigger:
  batch: true
  branches:
    include:
      - main
      - dev
      - release/*

pr:
  branches:
    include:
      - main
      - dev
      - release/*

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-windows-2022
      os: windows

    sdl:
      codeql:
        runSourceLanguagesInSourceAnalysis: true

    stages:
      - stage: LintAndTypecheck
        dependsOn: []
        jobs:
          - template: /azure-pipelines/templates/lint.yml@self
        pool:
          name: 1es-pool-azfunc
          image: 1es-ubuntu-22.04
          os: linux

      - stage: WindowsUnitTests
        dependsOn:
          - LintAndTypecheck
        jobs:
          - template: /azure-pipelines/templates/test.yml@self

      - stage: LinuxUnitTests
        dependsOn:
          - LintAndTypecheck
        jobs:
          - template: /azure-pipelines/templates/test.yml@self
        pool:
          name: 1es-pool-azfunc
          image: 1es-ubuntu-22.04
          os: linux

      - stage: Build
        dependsOn:
          - WindowsUnitTests
          - LinuxUnitTests
        jobs:
          - template: /azure-pipelines/templates/build.yml@self
            parameters:
              IsPrerelease: ${{ parameters.IsPrerelease }}
