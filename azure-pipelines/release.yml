parameters:
  - name: dryRun
    type: boolean
    default: true
    displayName: 'Dry run (validate the package without publishing through ESRP)'

pr: none
trigger: none

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
  pipelines:
    - pipeline: ConnectorsSDKCI
      project: internal
      source: connectors-nodejs-sdk.official
      branch: main
      trigger: none

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-ubuntu-22.04
      os: linux

    stages:
      - stage: Release
        displayName: 'Release Azure Connectors SDK'
        jobs:
          - ${{ if eq(parameters.dryRun, false) }}:
            - job: ApproveRelease
              displayName: 'Approve production npm release'
              pool: server
              timeoutInMinutes: 1500
              steps:
                - task: ManualValidation@1
                  displayName: 'Approve publishing @azure/connectors'
                  timeoutInMinutes: 1440
                  inputs:
                    notifyUsers: '[TEAM FOUNDATION]\David Burg,[TEAM FOUNDATION]\Rama Krishna Rayudu,[TEAM FOUNDATION]\Varad Meru''s Team'
                    approvers: '[TEAM FOUNDATION]\David Burg,[TEAM FOUNDATION]\Rama Krishna Rayudu,[TEAM FOUNDATION]\Varad Meru''s Team'
                    allowApproversToApproveTheirOwnRuns: false
                    onTimeout: reject
                    instructions: |
                      Review the selected official build '$(resources.pipeline.ConnectorsSDKCI.runName)' (ID '$(resources.pipeline.ConnectorsSDKCI.runID)').
                      Verify its source commit '$(resources.pipeline.ConnectorsSDKCI.sourceCommit)', package version, and successful dry-run results.
                      Approve to validate the artifact and submit it to ESRP for public npm distribution.
                      Reject if the selected build or package is incorrect or publishing is not intended.

          - job: ReleaseConnectorsSDK
            displayName: 'Validate and release @azure/connectors'
            ${{ if eq(parameters.dryRun, false) }}:
              dependsOn: ApproveRelease
            templateContext:
              type: releaseJob
              ${{ if eq(parameters.dryRun, false) }}:
                isProduction: true
              ${{ else }}:
                isProduction: false
              inputs:
                - input: pipelineArtifact
                  pipeline: ConnectorsSDKCI
                  artifactName: drop
                  targetPath: $(System.DefaultWorkingDirectory)/drop
            steps:
              - checkout: none

              - task: NodeTool@0
                displayName: 'Install Node.js'
                inputs:
                  versionSpec: 22.x

              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $artifactFolder = Join-Path '$(System.DefaultWorkingDirectory)' 'drop'
                  $artifacts = @(Get-ChildItem -LiteralPath $artifactFolder -File -Filter '*.tgz')
                  if ($artifacts.Count -ne 1) {
                    throw "Release artifact folder '$artifactFolder' must contain exactly one npm '.tgz' package; found '$($artifacts.Count)'."
                  }

                  $packagePath = $artifacts[0].FullName
                  $manifestContent = tar -xOf $packagePath package/package.json
                  if ($LASTEXITCODE -ne 0) {
                    throw "Could not read the npm package manifest from '$packagePath'."
                  }

                  $manifest = ($manifestContent -join "`n") | ConvertFrom-Json
                  if ($manifest.name -ne '@azure/connectors' -or [string]::IsNullOrWhiteSpace($manifest.version)) {
                    throw "Release artifact must be '@azure/connectors' with a nonempty version."
                  }

                  Write-Host "Validating '$($manifest.name)' version '$($manifest.version)'."
                  npm publish "$packagePath" --dry-run --ignore-scripts --tag dry-run --access public --registry https://registry.npmjs.org/
                  if ($LASTEXITCODE -ne 0) {
                    throw "npm publish dry run failed for '$packagePath'."
                  }

                  $releaseFolder = Join-Path '$(Build.ArtifactStagingDirectory)' 'npm-release'
                  New-Item -ItemType Directory -Path $releaseFolder | Out-Null
                  Copy-Item -LiteralPath $packagePath -Destination $releaseFolder
                displayName: 'Validate npm release artifact (no publishing)'

              - ${{ if eq(parameters.dryRun, true) }}:
                - pwsh: |
                    Write-Host 'Dry run completed. No ESRP request was submitted and no package was published.'
                  displayName: 'Report dry-run completion'

              - ${{ if eq(parameters.dryRun, false) }}:
                - task: SFP.release-tasks.custom-build-release-task.EsrpRelease@9
                  displayName: 'ESRP release @azure/connectors'
                  inputs:
                    connectedservicename: $(EsrpServiceConnection)
                    usemanagedidentity: true
                    keyvaultname: $(EsrpKeyVaultName)
                    signcertname: $(EsrpSigningCertificateName)
                    clientid: $(EsrpClientId)
                    intent: PackageDistribution
                    contenttype: npm
                    contentsource: Folder
                    folderlocation: $(Build.ArtifactStagingDirectory)/npm-release
                    waitforreleasecompletion: true
                    owners: $(Build.RequestedForEmail)
                    approvers: $(Build.RequestedForEmail)
                    serviceendpointurl: https://api.esrp.microsoft.com
                    mainpublisher: $(EsrpPublisher)
                    domaintenantid: $(EsrpTenantId)
