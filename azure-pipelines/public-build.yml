parameters:
  - name: NodeLtsVersion
    type: string
    default: 22.x
  - name: npmRegistry
    type: string
    default: 'https://pkgs.dev.azure.com/azfunc/public/_packaging/upstream/npm/registry/'

trigger:
  batch: true
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

schedules:
  - cron: '0 0 * * *'
    displayName: At 12:00 AM, every day
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: 1es
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1es
  parameters:
    pool:
      name: 1es-pool-azfunc-public
      image: 1es-windows-2022
      os: windows

    sdl:
      codeql:
        runSourceLanguagesInSourceAnalysis: true

    stages:
      - stage: LintAndTypecheck
        dependsOn: []
        jobs:
          - template: /azure-pipelines/templates/lint.yml@self
            parameters:
              NodeVersion: ${{ parameters.NodeLtsVersion }}
              npmRegistry: ${{ parameters.npmRegistry }}
        pool:
          name: 1es-pool-azfunc-public
          image: 1es-ubuntu-22.04
          os: linux

      - stage: WindowsUnitTests
        dependsOn:
          - LintAndTypecheck
        jobs:
          - template: /azure-pipelines/templates/test.yml@self
            parameters:
              NodeLtsVersion: ${{ parameters.NodeLtsVersion }}
              npmRegistry: ${{ parameters.npmRegistry }}

      - stage: LinuxUnitTests
        dependsOn:
          - LintAndTypecheck
        jobs:
          - template: /azure-pipelines/templates/test.yml@self
            parameters:
              NodeLtsVersion: ${{ parameters.NodeLtsVersion }}
              npmRegistry: ${{ parameters.npmRegistry }}
        pool:
          name: 1es-pool-azfunc-public
          image: 1es-ubuntu-22.04
          os: linux
