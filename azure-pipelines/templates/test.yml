jobs:
  - job: UnitTests
    strategy:
      matrix:
        Node20:
          NODE_VERSION: 20.x
        Node22:
          NODE_VERSION: 22.x

    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: $(NODE_VERSION)
        displayName: Install Node.js

      - script: npm ci
        displayName: npm ci

      - script: npm run build
        displayName: npm run build

      - script: npm run smoke
        displayName: npm run smoke

      - script: npx jest --config config/jest.config.cjs --verbose --coverage
        displayName: Run tests with coverage

      - task: PublishPipelineArtifact@1
        displayName: Publish coverage artifact
        condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Linux'), eq(variables['NODE_VERSION'], '20.x'))
        inputs:
          targetPath: $(Build.SourcesDirectory)/coverage
          artifactName: coverage-report
