parameters:
  - name: IsPrerelease
    type: boolean
    default: true

jobs:
  - job:
    templateContext:
      outputs:
        - output: pipelineArtifact
          path: $(Build.ArtifactStagingDirectory)/dropOutput
          artifact: drop
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: 20.x
        displayName: Install Node.js

      - script: npm ci
        displayName: npm ci

      - script: npm run build
        displayName: npm run build

      - script: npm pack
        displayName: npm pack

      - task: CopyFiles@2
        displayName: Copy npm package to dropOutput
        inputs:
          sourceFolder: $(Build.SourcesDirectory)
          contents: |
            *.tgz
          targetFolder: $(Build.ArtifactStagingDirectory)/dropOutput
          cleanTargetFolder: true
