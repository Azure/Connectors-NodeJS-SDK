parameters:
  - name: IsPrerelease
    type: boolean
    default: true

jobs:
  - job:
    templateContext:
      outputs:
        - output: pipelineArtifact
          path: $(Build.ArtifactStagingDirectory)/dropOutput
          artifact: drop
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: 20.x
        displayName: 'Install Node.js'

      - bash: |
          cat > $(EXTENSION_DIRECTORY)/.npmrc <<'EOF'
          registry=https://azfunc.pkgs.visualstudio.com/internal/_packaging/upstream/npm/registry/
          always-auth=true
          EOF
          echo "--- generated .npmrc ---"
          cat $(EXTENSION_DIRECTORY)/.npmrc
        displayName: 'Create .npmrc (internal feed)'

      - task: npmAuthenticate@0
        displayName: 'Authenticate to internal npm feed'
        inputs:
          workingFile: $(EXTENSION_DIRECTORY)/.npmrc

      - bash: |
          cd $(EXTENSION_DIRECTORY)
          npm ci --no-audit --no-fund
        displayName: 'npm ci'

      - script: npm run build
        displayName: npm run build

      - script: npm pack
        displayName: npm pack

      - task: CopyFiles@2
        displayName: Copy npm package to dropOutput
        inputs:
          sourceFolder: $(Build.SourcesDirectory)
          contents: |
            *.tgz
          targetFolder: $(Build.ArtifactStagingDirectory)/dropOutput
          cleanTargetFolder: true
