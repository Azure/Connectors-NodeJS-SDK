parameters:
  - name: IsPrerelease
    type: boolean
    default: true

jobs:
  - job: BuildPackage
    templateContext:
      outputs:
        - output: pipelineArtifact
          path: $(Build.ArtifactStagingDirectory)/dropOutput
          artifact: drop
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: 20.x
        displayName: 'Install Node.js'

      - bash: |
          cat > $BUILD_SOURCESDIRECTORY/.npmrc <<'EOF'
          registry=https://azfunc.pkgs.visualstudio.com/internal/_packaging/upstream/npm/registry/
          always-auth=true
          EOF
          echo "--- generated .npmrc ---"
          cat $BUILD_SOURCESDIRECTORY/.npmrc
        displayName: 'Create .npmrc (internal feed)'

      - task: npmAuthenticate@0
        displayName: 'Authenticate to internal npm feed'
        inputs:
          workingFile: $(Build.SourcesDirectory)/.npmrc

      - bash: |
          cd $BUILD_SOURCESDIRECTORY
          npm ci --no-audit --no-fund
        displayName: 'npm ci'

      - script: npm run build
        displayName: npm run build

      - ${{ if eq(parameters.IsPrerelease, true) }}:
        - bash: |
            cd $BUILD_SOURCESDIRECTORY
            baseVersion=$(node -p "require('./package.json').version.split('-')[0]")
            utcDate=$(date -u +%Y%m%d)
            prereleaseVersion="${baseVersion}-prerelease.${utcDate}"
            npm version "$prereleaseVersion" --no-git-tag-version
            echo "Using prerelease package version: $prereleaseVersion"
          displayName: Set prerelease package version

      - ${{ if ne(parameters.IsPrerelease, true) }}:
        - bash: |
            cd $BUILD_SOURCESDIRECTORY
            stableVersion=$(node -p "require('./package.json').version.split('-')[0]")
            npm version "$stableVersion" --no-git-tag-version
            echo "Using stable package version: $stableVersion"
          displayName: Set stable package version

      - script: npm pack
        displayName: npm pack

      - task: CopyFiles@2
        displayName: Copy npm package to dropOutput
        inputs:
          sourceFolder: $(Build.SourcesDirectory)
          contents: |
            *.tgz
          targetFolder: $(Build.ArtifactStagingDirectory)/dropOutput
          cleanTargetFolder: true
