parameters:
  - name: NodeVersion
    type: string
    default: 22.x
  - name: npmRegistry
    type: string
    default: 'https://pkgs.dev.azure.com/azfunc/internal/_packaging/upstream/npm/registry/'

jobs:
  - job: LintAndTypecheck
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: ${{ parameters.NodeVersion }}
        displayName: 'Install Node.js'

      - bash: |
          cat > $BUILD_SOURCESDIRECTORY/.npmrc <<'EOF'
          registry=${{ parameters.npmRegistry }}
          always-auth=true
          EOF
          echo "--- generated .npmrc ---"
          cat $BUILD_SOURCESDIRECTORY/.npmrc
        displayName: 'Create .npmrc'

      - task: npmAuthenticate@0
        displayName: 'Authenticate npm registry'
        inputs:
          workingFile: $(Build.SourcesDirectory)/.npmrc

      - bash: |
          cd $BUILD_SOURCESDIRECTORY
          npm ci --no-audit --no-fund
        displayName: 'npm ci'

      - script: npm run typecheck
        displayName: npm run typecheck

      - script: npm run typecheck:samples
        displayName: npm run typecheck:samples

      - script: npm run lint
        displayName: npm run lint

      - script: npm run lint:md
        displayName: npm run lint:md
