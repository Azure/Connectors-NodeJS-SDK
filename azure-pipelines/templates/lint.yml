jobs:
  - job: LintAndTypecheck
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: 22.x
        displayName: 'Install Node.js'

      - bash: |
          cat > $(Build.SourcesDirectory)/.npmrc <<'EOF'
          registry=https://azfunc.pkgs.visualstudio.com/internal/_packaging/upstream/npm/registry/
          always-auth=true
          EOF
          echo "--- generated .npmrc ---"
          cat $(Build.SourcesDirectory)/.npmrc
        displayName: 'Create .npmrc (internal feed)'

      - task: npmAuthenticate@0
        displayName: 'Authenticate to internal npm feed'
        inputs:
          workingFile: $(Build.SourcesDirectory)/.npmrc

      - bash: |
          cd $(Build.SourcesDirectory)
          npm ci --no-audit --no-fund
        displayName: 'npm ci'

      - script: npm run typecheck
        displayName: npm run typecheck

      - script: npm run typecheck:samples
        displayName: npm run typecheck:samples

      - script: npm run lint
        displayName: npm run lint

      - script: npm run lint:md
        displayName: npm run lint:md
